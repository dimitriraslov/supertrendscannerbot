name: Supertrend 1D Scanner

on:
  schedule:
    - cron: '23 22 * * 1-5'   # Mon-Fri 22:23 UTC — daily Supertrend + RSI
    - cron: '7 1 * * 2-6'     # Tue-Sat 01:07 UTC — overnight backup
    - cron: '51 22 * * 5'     # Friday 22:51 UTC — weekly Supertrend + RSI

  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run weekly scan?'
        required: false
        default: 'false'

concurrency:
  # Shared with the RSI workflow. The two jobs run the same scanner and the
  # same alert ledger; queueing them stops a second run from re-sending alerts
  # the first run has not committed yet.
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-tests
        run: python selftest.py

      - name: Run daily Supertrend scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
        run: python scanner.py

      - name: Run weekly Supertrend scanner (Fridays only)
        if: github.event.schedule == '51 22 * * 5' || github.event.inputs.weekly == 'true'
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
        run: python scanner.py --weekly --no-summary

      - name: Save state and dashboard data back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delivery flags live in scanner_state.json. Committing only the legacy
          # state.json left the watermark in September and re-sent the catch-up.
          for f in scanner_state.json dashboard_data.json; do
            if [ -f "$f" ]; then
              if grep -E '^(<<<<<<<|>>>>>>>)' "$f" >/dev/null; then
                echo "Refusing to commit $f because it contains conflict markers."
                exit 1
              fi
              git add -- "$f"
            fi
          done
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update scanner state + dashboard data [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push; then
                exit 0
              fi
              echo "Push attempt $i failed, retrying..."
            else
              echo "Rebase attempt $i hit a conflict."
              resolved=1
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  scanner_state.json|dashboard_data.json)
                    git checkout --theirs -- "$f"
                    git add -- "$f"
                    ;;
                  *)
                    resolved=0
                    ;;
                esac
              done
              if [ "$resolved" = 1 ]; then
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              else
                echo "Conflict is outside generated scanner files."
                git rebase --abort || true
              fi
            fi
            sleep $((i * 5))
          done
          echo "Could not push scanner state."
          exit 1
