name: Supertrend 1D Scanner

on:
  schedule:
    - cron: '23 22 * * 1-5'   # Mon-Fri 22:23 UTC — daily Supertrend + RSI
    - cron: '7 1 * * 2-6'     # Tue-Sat 01:07 UTC — overnight backup
    - cron: '51 22 * * 5'     # Friday 22:51 UTC — weekly Supertrend + RSI

  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run weekly scan?'
        required: false
        default: 'false'

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-tests
        run: python selftest.py

      - name: Run daily Supertrend scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
        run: python scanner.py

      - name: Run weekly Supertrend scanner (Fridays only)
        if: github.event.schedule == '51 22 * * 5' || github.event.inputs.weekly == 'true'
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
        run: python scanner.py --weekly --no-summary

      - name: Save state and dashboard data back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add state.json dashboard_data.json
          git diff --staged --quiet || git commit -m "Update scanner state + dashboard data [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i failed, retrying..."
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
