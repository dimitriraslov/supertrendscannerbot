name: RSI Oversold Scanner

on:
  schedule:
    # Daily RSI (1D): runs Mon-Fri after US close
    # 22:47 UTC = 6:47 PM ET — after 4pm close + 45min buffer
    - cron: '47 22 * * 1-5'   # Mon-Fri post-close (1D scan)

    # Weekly RSI (1W): runs once on Monday after close
    # Weekly bar closes Friday night — Monday scan catches it fully settled
    - cron: '47 22 * * 3'     # Wednesday post-close (1W scan)

  workflow_dispatch:
    # Manual trigger for testing — runs both

concurrency:
  # Same group as Supertrend 1D Scanner. Both jobs call scanner.py and share
  # scanner_state.json, so they must not send alerts at the same time.
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI scanner — Daily (1D) every weekday
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
        run: python rsi_scanner.py --timeframe 1day

      - name: Run RSI scanner — Weekly (1W) on Mondays only
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 22 * * 3'
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:   ${{ secrets.TELEGRAM_CHAT }}
        run: python rsi_scanner.py --timeframe 1week

      - name: Save state and dashboard data back to repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # rsi_scanner.py is the v4 scanner. Sent alerts are stored in
          # scanner_state.json, not rsi_state.json.
          for f in scanner_state.json dashboard_data.json; do
            if [ -f "$f" ]; then
              if grep -E '^(<<<<<<<|>>>>>>>)' "$f" >/dev/null; then
                echo "Refusing to commit $f because it contains conflict markers."
                exit 1
              fi
              git add -- "$f"
            fi
          done
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update scanner state + dashboard data [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push; then
                exit 0
              fi
              echo "Push attempt $i failed, retrying..."
            else
              echo "Rebase attempt $i hit a conflict."
              resolved=1
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  scanner_state.json|dashboard_data.json)
                    git checkout --theirs -- "$f"
                    git add -- "$f"
                    ;;
                  *)
                    resolved=0
                    ;;
                esac
              done
              if [ "$resolved" = 1 ]; then
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              else
                echo "Conflict is outside generated scanner files."
                git rebase --abort || true
              fi
            fi
            sleep $((i * 5))
          done
          echo "Could not push scanner state."
          exit 1
