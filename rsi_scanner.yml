name: RSI scanner moved to unified v4 workflow
# Replaces the old scheduled workflow so an upload also removes its cron jobs.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'RSI, divergences and pullbacks now run in Supertrend Scanner v4. Run that workflow instead.'
